name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test

  test:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar os dois ambientes
        env:
          MATRIX_RESULT: ${{ needs.validate.result }}
        run: test "$MATRIX_RESULT" = "success"

